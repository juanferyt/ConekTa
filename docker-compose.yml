services:
  postgres:
    image: postgres:16-alpine
    container_name: conekta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conekta}
      POSTGRES_USER: ${POSTGRES_USER:-conekta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conekta_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - conekta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-conekta_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change_this_minio_password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGIN:-http://localhost:5174}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - conekta_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/$${S3_BUCKET} && mc anonymous set download local/$${S3_BUCKET}"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-conekta_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change_this_minio_password}
      S3_BUCKET: ${S3_BUCKET:-conekta-files}

volumes:
  conekta_postgres_data:
  conekta_minio_data:
